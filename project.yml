name: EVRoutePro
options:
  bundleIdPrefix: com.example
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    SWIFT_VERSION: '5.0'
targets:
  EVRoutePro:
    type: application
    platform: iOS
    sources: [EVRoutePro]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.EVRoutePro
        INFOPLIST_FILE: EVRoutePro/Info.plist
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: NO
